name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - run: make vet
      - name: Vulnerability check
        run: make vuln
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - run: make build
      - run: make test-scripts
      - run: make coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      # Every build keeps its binaries as a workflow artifact: the release
      # archives and checksums, versioned by commit.
      - name: Build binaries
        run: make dist-all
      - uses: actions/upload-artifact@v7
        with:
          name: crprune-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # No cache: release binaries are built from modules downloaded and
      # verified against go.sum, not from a cache another job could write.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"; rest="${ver#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Build release artifacts
        run: make dist-all VERSION="${{ steps.version.outputs.version }}"

      - name: Create and push tag
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums-*.txt scripts/download.sh
